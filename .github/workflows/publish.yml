name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing and provenance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        # npm CLI handles OIDC trusted publishing natively.
        # pnpm publish does not yet support OIDC auth — use npm publish instead.
        # --provenance attaches a signed build attestation to the package.
        # --access public is required for scoped packages (@scope/name).
        run: npm publish --provenance --access public
